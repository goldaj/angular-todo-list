<form #templateDrivenForm="ngForm" (ngSubmit)="submit()">
    <mat-card class="main-card">
        <mat-card-header>
            <mat-card-title>{{isEdit? 'Editer' : 'Ajouter'}} un Todo en Template Driven</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <mat-form-field>
                <input id="title" #title="ngModel" type="text" name="title" [(ngModel)]="todo.title" matInput
                    placeholder="Titre" required minlength="4">
                <mat-error *ngIf="title.invalid && (title.dirty || title.touched) 
                        && title.errors && title.errors.minlength">
                    Le titre doit faire 4 caractères minumum
                </mat-error>
                <mat-error *ngIf="title.invalid && (title.dirty || title.touched) 
                    && title.errors && title.errors.required">
                    Le titre est obligatoire
                </mat-error>
            </mat-form-field>
            <mat-checkbox [(ngModel)]="todo.completed" name="completed" *ngIf="isEdit">
                Fait
            </mat-checkbox>
            <input type="hidden" name="userId" [ngModel]="todo.userId">
            <input type="hidden" name="id" [ngModel]="todo.id">
        </mat-card-content>
        <mat-card-actions>
            <button mat-button type="submit" [disabled]="templateDrivenForm.invalid">{{isEdit? 'Editer' : 'Ajouter'}}</button>
        </mat-card-actions>
    </mat-card>
</form>
<form [formGroup]="modelDrivenForm" (ngSubmit)="submitReactive()" #f="ngForm">
    <mat-card class="main-card">
        <mat-card-header>
            <mat-card-title>{{isEdit? 'Editer' : 'Ajouter'}} un Todo en Reactive Form</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <mat-form-field>
                <input type="text" matInput placeholder="Titre" formControlName="title" required>
                <mat-error *ngIf="!titleControl.valid && 
                (titleControl.dirty || titleControl.touched)">
                    Le titre est obligatoire et doit faire 4 caractères minumum
                </mat-error>
            </mat-form-field>
            <mat-checkbox formControlName="completed" *ngIf="isEdit">
                Fait
            </mat-checkbox>
        </mat-card-content>
        <mat-card-actions>
            <button mat-button type="submit" [disabled]="modelDrivenForm.invalid">{{isEdit? 'Editer' : 'Ajouter'}}</button>
        </mat-card-actions>
    </mat-card>
</form>
